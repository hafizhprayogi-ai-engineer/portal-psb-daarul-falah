<section class="dashboard-section"><div class="section-heading"><h2>Tahap penerimaan</h2><span>{{ flow.count }} dari {{ flow.total }}</span></div><div class="journey-list">{% for step in flow.steps %}<a href="/peserta/{{ p.id }}/menu/{{ step.section }}" class="journey-item {{ 'finished' if step.done else '' }}"><span class="journey-number">{{ '✓' if step.done else loop.index }}</span><span><strong>{{ step.label }}</strong><small>{{ 'Terpenuhi' if step.done else 'Belum terpenuhi' }}</small></span><span class="journey-arrow" aria-hidden="true">›</span></a>{% endfor %}</div></section>
