[project]
name = "portal-psb"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<3.2",
    "waitress>=3.0,<4",
    "reportlab>=5.1,<6",
    "qrcode>=8.2,<9",
    "pillow>=13,<14",
    "openpyxl>=3.1,<4",
    "python-docx>=1.2,<2",
    "python-dotenv>=1.1,<2",
    "tzdata>=2025.2",
    "PyMySQL[rsa]>=1.1.1,<2",
    "google-auth-oauthlib>=1.2,<2",
    "requests>=2.32,<3",
    "filelock>=3.16,<4",
    "psutil>=6,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py312"]
